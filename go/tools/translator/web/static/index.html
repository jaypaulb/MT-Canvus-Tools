<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Lingual Canvas Translator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="flag-container">
        <img id="flag-image" src="/flags/Klingon_Empire_Flag.svg" alt="Flag">
    </div>
    <div id="language-dropdown" class="hidden">
        <ul>
            <li data-lang="Mandarin Chinese">Mandarin Chinese</li>
            <li data-lang="Spanish">Spanish</li>
            <li data-lang="English">English</li>
            <li data-lang="Hindi">Hindi</li>
            <li data-lang="Arabic">Arabic</li>
            <li data-lang="Klingon">Klingon</li>
        </ul>
    </div>
    <div id="message-area" class="hidden"></div>
    <script src="script.js"></script>
</body>
</html>
