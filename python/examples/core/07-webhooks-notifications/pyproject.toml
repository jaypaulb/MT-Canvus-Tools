[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "canvus-example-07-webhooks-notifications"
version = "0.1.0"
description = "Bridge Canvus subscribe events to an outbound HTTP webhook."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "MultiTaction" }]
dependencies = [
    "canvus-sdk",
    "structlog>=24.1",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
]

[tool.uv.sources]
canvus-sdk = { workspace = true }

[tool.hatch.build.targets.wheel]
bypass-selection = true
