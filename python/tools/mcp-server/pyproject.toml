[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "canvus-mcp-server"
version = "0.1.0"
description = "MCP server exposing Canvus operations as MCP tools for AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "MultiTaction" }]
dependencies = [
    "canvus-sdk",
    "fastapi>=0.110",
    "fastapi-mcp>=0.4.0",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "httpx>=0.27",
    "pdfplumber>=0.10",
    "psutil>=5.9",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4",
    "pytest-mock>=3.10",
    "mypy>=1.10",
    "ruff>=0.5",
    "respx>=0.21",
]

[tool.uv.sources]
canvus-sdk = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/canvus_mcp_server"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_any_generics = true
disallow_untyped_decorators = true
no_implicit_reexport = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pdfplumber.*", "psutil.*", "fastapi_mcp", "fastapi_mcp.*", "aiosqlite", "aiosqlite.*"]
ignore_missing_imports = true
follow_untyped_imports = true
